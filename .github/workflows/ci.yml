name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel older runs on the same ref when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Fast tier: hygiene + unit tests. Should always finish in under a minute.
  # -------------------------------------------------------------------------
  lint-and-test:
    name: Lint, hygiene, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync test dependencies
        run: uv sync --extra test

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Unit tests (no e2e)
        run: uv run pytest -m "not e2e"

      # ----- Hygiene checks ------------------------------------------------

      - name: Verify symlinks resolve
        run: |
          set -e
          for path in CLAUDE.md .agents/skills/build-binder/SKILL.md .claude/skills/build-binder/SKILL.md; do
            if [ ! -e "$path" ]; then
              echo "::error::symlink target missing: $path"
              exit 1
            fi
          done

      - name: Verify sensitive keys are blank in committed .env
        # `.env` is a documented template. Any key listed in SENSITIVE_KEYS
        # must be present-but-blank — real values belong only in .env.local.
        # Non-sensitive keys (FUZZY_MATCH_THRESHOLD, SOFFICE_PATH, etc.) may
        # carry defaults.
        run: |
          set -e
          SENSITIVE_KEYS="PCO_APPLICATION_ID PCO_SECRET"
          fail=0
          for key in $SENSITIVE_KEYS; do
            if grep -E "^${key}=.+" .env >/dev/null; then
              echo "::error file=.env::${key} must be blank in committed .env (set it in .env.local instead)"
              fail=1
            fi
          done
          exit $fail

      - name: Verify scripts are executable
        run: |
          set -e
          for f in scripts/build_binder.py scripts/check_deps.sh; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::script is not executable (chmod +x required)"
              exit 1
            fi
          done

      - name: Gitleaks — secret scan
        # We run the binary directly rather than gitleaks/gitleaks-action@v2
        # so we don't need pull-requests: write permission (the action uses
        # it to comment on PRs). `detect` scans both the working tree and
        # the full git history.
        run: |
          set -e
          version="8.21.2"
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  # -------------------------------------------------------------------------
  # Slow tier: end-to-end test that actually runs LibreOffice. Splitting it
  # off means lint/unit failures fail fast and don't pay the ~90s LO install.
  # Runs in parallel with `lint-and-test`.
  # -------------------------------------------------------------------------
  e2e:
    name: End-to-end (LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync test dependencies
        run: uv sync --extra test

      - name: End-to-end tests
        run: uv run pytest -m e2e
